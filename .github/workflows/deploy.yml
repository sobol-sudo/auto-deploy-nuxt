name: Deploy to Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SECRET_AUTO_DEPLOY }}

      - name: Copy files to the server
        run: |
          scp -o StrictHostKeyChecking=no -r ./.output/* \
            root@${{ vars.DEPLOY_HOST }}:/auto-deploy-nuxt

      - name: Restart the server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.DEPLOY_HOST }} \
            "cd /auto-deploy-nuxt && pm2 restart app"
